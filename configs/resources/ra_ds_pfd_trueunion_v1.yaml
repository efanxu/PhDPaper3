schema_version: 1

semantic_source:
  file: sdwpf_raw_aligned.parquet
  wspd_column: Wspd

semantic:
  top_k: 10
  min_overlap_ratio: 0.5
  min_overlap_count: 500
  min_similarity: 0.0

distance:
  top_k: 5

union:
  self_loops: false

output:
  file: dataset/derived/ra_ds_pfd/ra_ds_pfd_trueunion_sdwpf_v1.npz
